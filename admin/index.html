<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - DAI PY</title>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    (function() {
      const key = 'decap-cms-user';
      if (!localStorage.getItem(key)) {
        const token = prompt("Ingresa tu Personal Access Token de GitHub (github_pat_...):");
        if (token) {
          localStorage.setItem(key, JSON.stringify({ token: token.trim(), backendName: 'github' }));
          window.location.reload();
        }
      }
    })();
  </script>
</body>
</html>
