backend:
  name: github
  repo: daipyofficial/daipyofficial
  branch: main
  auth_type: implicit

media_folder: "public/uploads"
public_folder: "public/uploads"

collections:
  - name: "productos"
    label: "Productos"
    folder: "contenido/productos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre del Producto", name: "nombre", widget: "string" }
      - { label: "Imagen del Producto", name: "img", widget: "image" }
      - { label: "Precio (Gs.)", name: "precio", widget: "string" }
      - { label: "Descripción", name: "desc", widget: "text", required: false }
