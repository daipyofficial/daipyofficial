backend:
  name: github
  repo: daipyofficial/daipyofficial
  branch: main
  auth_methods: [token]

media_folder: "public/uploads"
public_folder: "/daipyofficial/public/uploads"

collections:
  - name: "apariencia"
    label: "Apariencia"
    files:
      - name: "diseno"
        label: "Tipografía y Estilo"
        file: "contenido/configuracion/diseno.json"
        format: "json"
        fields:
          - label: "Tipografía de la Web"
            name: "fuente"
            widget: "select"
            default: "Poppins"
            options:
              - "Poppins"
              - "Montserrat"
              - "Inter"
              - "Roboto"
              - "Lato"

          - label: "Precios en Negrita"
            name: "precio_negrita"
            widget: "boolean"
            default: true

      - name: "textos"
        label: "Textos de la Web"
        file: "contenido/configuracion/textos.json"
        format: "json"
        fields:
          - label: "Título de la pestaña"
            name: "titulo_pagina"
            widget: "string"
            default: "DAI PY — Tienda Oficial"

          - label: "Descripción de la página"
            name: "descripcion_pagina"
            widget: "text"
            default: "DAI PY - Tienda Oficial"

          - label: "Barra superior"
            name: "barra_superior"
            widget: "string"
            default: "DAI PY · TIENDA OFICIAL"

          - label: "Etiqueta de contacto"
            name: "contacto_etiqueta"
            widget: "string"
            default: "Contacto"

          - label: "Botón abrir menú"
            name: "menu_abrir"
            widget: "string"
            default: "Menú"

          - label: "Botón cerrar menú"
            name: "menu_cerrar"
            widget: "string"
            default: "Cerrar"

          - label: "Menú - Inicio"
            name: "menu_inicio"
            widget: "string"
            default: "Inicio"

          - label: "Menú - Productos"
            name: "menu_productos"
            widget: "string"
            default: "Productos"

          - label: "Menú - Contacto"
            name: "menu_contacto"
            widget: "string"
            default: "Contacto"

          - label: "Enlace Productos del encabezado"
            name: "enlace_productos"
            widget: "string"
            default: "Productos"

          - label: "Texto visible de WhatsApp"
            name: "whatsapp_texto"
            widget: "string"
            default: "WhatsApp"

          - label: "Etiqueta del banner"
            name: "hero_etiqueta"
            widget: "string"
            default: "DAI PY"

          - label: "Título por defecto del banner"
            name: "hero_titulo"
            widget: "string"
            default: "Detalles que forman parte de tu historia."

          - label: "Texto por defecto del banner"
            name: "hero_subtitulo"
            widget: "text"
            default: "Accesorios, objetos y detalles seleccionados para acompañar tu día."

          - label: "Etiqueta sobre Productos"
            name: "productos_etiqueta"
            widget: "string"
            default: "Tienda"

          - label: "Título de Productos"
            name: "productos_titulo"
            widget: "string"
            default: "Productos"

          - label: "Texto introductorio de Productos"
            name: "productos_intro"
            widget: "text"
            default: "Elegí tu producto y realizá tu pedido directamente por WhatsApp."

          - label: "Texto del botón Comprar"
            name: "boton_comprar"
            widget: "string"
            default: "Pedido directo · Comprar"

          - label: "Texto cuando no hay productos"
            name: "sin_productos"
            widget: "string"
            default: "Aún no hay productos disponibles."

          - label: "Paginación - Anterior"
            name: "paginacion_anterior"
            widget: "string"
            default: "Anterior"

          - label: "Paginación - Siguiente"
            name: "paginacion_siguiente"
            widget: "string"
            default: "Siguiente"

          - label: "Etiqueta editorial"
            name: "editorial_etiqueta"
            widget: "string"
            default: "DAI PY"

          - label: "Texto editorial"
            name: "editorial_texto"
            widget: "text"
            default: "Las cosas que elegimos llevar con nosotros también cuentan una historia."

          - label: "Pie - Correo"
            name: "pie_correo"
            widget: "string"
            default: "Correo"

          - label: "Pie - Instagram"
            name: "pie_instagram"
            widget: "string"
            default: "Instagram"

          - label: "Pie - Pedidos"
            name: "pie_pedidos"
            widget: "string"
            default: "Pedidos"

          - label: "Pie - Marca"
            name: "pie_marca"
            widget: "string"
            default: "DAI PY"

          - label: "Pie - Texto final"
            name: "pie_texto"
            widget: "string"
            default: "Tienda Oficial"

          - label: "Mensaje de WhatsApp para consulta general"
            name: "whatsapp_consulta"
            widget: "text"
            default: "Hola DAI PY, quisiera realizar una consulta."

          - label: "Mensaje de WhatsApp al comprar"
            name: "whatsapp_compra"
            widget: "text"
            default: "Hola DAI PY, quiero comprar {producto} por {precio}."
            hint: "Podés usar {producto} y {precio}; la web los reemplaza automáticamente."

  - name: "contacto"
    label: "Contacto y Compras"
    files:
      - name: "datos_contacto"
        label: "Datos de Contacto"
        file: "contenido/configuracion/contacto.json"
        format: "json"
        fields:
          - label: "Número de WhatsApp"
            name: "whatsapp"
            widget: "string"
            default: "+595985824098"

          - label: "Correo Electrónico"
            name: "email"
            widget: "string"
            default: "daiofficial.py@gmail.com"

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            default: "@daiofficial.py"

  - name: "banners"
    label: "Banners"
    label_singular: "Banner"
    folder: "contenido/banners"
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}}"
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"
        required: false

      - label: "Texto"
        name: "subtitulo"
        widget: "text"
        required: false

      - label: "Imagen"
        name: "imagen"
        widget: "image"

      - label: "Mostrar Banner"
        name: "activo"
        widget: "boolean"
        default: true

      - label: "Orden"
        name: "orden"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1

  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "contenido/productos"
    create: true
    slug: "{{slug}}"
    summary: "{{nombre}}"
    fields:
      - label: "Nombre del Producto"
        name: "nombre"
        widget: "string"

      - label: "Foto principal"
        name: "img"
        widget: "image"
        hint: "Esta es la primera foto que se muestra."

      - label: "Fotos adicionales"
        name: "imagenes"
        widget: "list"
        required: false
        hint: "Agregá todas las fotos o colores extra que necesites."
        field:
          label: "Foto"
          name: "imagen"
          widget: "image"

      - label: "Precio (Gs.)"
        name: "precio"
        widget: "string"

      - label: "Descripción"
        name: "desc"
        widget: "text"
        required: false

      - label: "Orden"
        name: "orden"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Opcional. Los números más bajos aparecen primero."
