backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "es"

editor:
  preview: false

collections:
  # -------------------------------------------------------------
  # SECCIÓN 1: CONFIGURACIÓN GENERAL (Logo, Banner, Textos y Tipografías)
  # -------------------------------------------------------------
  - name: "configuracion"
    label: "Configuración Web"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "Ajustes Generales de la Tienda"
        file: "contenido/configuracion.json"
        fields:
          - label: "Marca & Logotipo"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Logo de la Tienda", name: "logo", widget: "image", hint: "Sube tu imagen de logo (PNG sin fondo recomendado)" }

          - label: "Banner Principal"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Imagen del Banner", name: "banner", widget: "image", hint: "Sube la imagen horizontal principal" }
              - { label: "Título del Banner", name: "titulo", widget: "string", hint: "Ejemplo: Creado para los amantes de los detalles" }
              - { label: "Subtítulo / Descripción", name: "subtitulo", widget: "text", hint: "Texto descriptivo que va debajo del título principal" }

          - label: "Tipografías & Estilos"
            name: "typography"
            widget: "object"
            fields:
              - label: "Tipografía de Títulos"
                name: "font_headers"
                widget: "select"
                options:
                  - { label: "Playfair Display (Serif Elegante)", value: "Playfair Display" }
                  - { label: "Bodoni Moda (Serif Alta Costura)", value: "Bodoni Moda" }
                  - { label: "Cinzel (Clásico & Editorial)", value: "Cinzel" }
                  - { label: "Cormorant Garamond (Serif Tradicional)", value: "Cormorant Garamond" }
                  - { label: "Inter (Sans-Serif Moderno)", value: "Inter" }
                default: "Playfair Display"
              
              - label: "Tipografía de Texto General"
                name: "font_body"
                widget: "select"
                options:
                  - { label: "Inter (Limpio & Moderno)", value: "Inter" }
                  - { label: "Roboto (Neutro)", value: "Roboto" }
                  - { label: "Montserrat (Limpio & Geométrico)", value: "Montserrat" }
                  - { label: "Lora (Serif para Lectura)", value: "Lora" }
                default: "Inter"

  # -------------------------------------------------------------
  # SECCIÓN 2: PRODUCTOS
  # -------------------------------------------------------------
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "contenido/productos"
    create: true
    slug: "{{slug}}"
    summary: "{{nombre}} - {{precio}}"
    fields:
      - { label: "Nombre del Producto", name: "nombre", widget: "string", hint: "Ejemplo: Bolso de Mano Eclat" }
      - { label: "Precio", name: "precio", widget: "string", hint: "Ejemplo: 250.000 Gs." }
      - { label: "Imagen del Producto", name: "img", widget: "image", choose_url: false, hint: "Sube una imagen cuadrada de alta calidad" }
      - { 
          label: "Descripción Corta / Detalle", 
          name: "desc", 
          widget: "markdown", 
          required: false,
          buttons: ["bold", "italic", "bulleted-list", "numbered-list"],
          editor_components: [],
          modes: ["rich_text"],
          hint: "Escribe aquí los detalles del producto."
        }
