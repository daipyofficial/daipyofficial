backend:
  name: github
  repo: daipyofficial/daipyofficial
  branch: main

media_folder: "public/uploads"
public_folder: "/daipyofficial/public/uploads"

collections:

  - name: "apariencia"
    label: "Apariencia"

    files:

      - name: "tipografia"
        label: "Tipografía y Estilo"
        file: "contenido/configuracion/diseno.json"
        format: "json"

        fields:

          - label: "Tipografía de la Web"
            name: "fuente"
            widget: "select"
            default: "Poppins"

            options:
              - label: "Poppins"
                value: "Poppins"

              - label: "Montserrat"
                value: "Montserrat"

              - label: "Inter"
                value: "Inter"

              - label: "Lato"
                value: "Lato"

              - label: "Roboto"
                value: "Roboto"

          - label: "Precios en Negrita"
            name: "precio_negrita"
            widget: "boolean"
            default: true


  - name: "contacto"
    label: "Contacto y Compras"

    files:

      - name: "datos_contacto"
        label: "Datos de Contacto"
        file: "contenido/configuracion/contacto.json"
        format: "json"

        fields:

          - label: "Número de WhatsApp"
            name: "whatsapp"
            widget: "string"
            default: "+595985824098"

          - label: "Correo Electrónico"
            name: "email"
            widget: "string"
            default: "daiofficial.py@gmail.com"

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            default: "@daiofficial.py"


  - name: "banners"
    label: "Banners"
    label_singular: "Banner"
    folder: "contenido/banners"
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}}"

    fields:

      - label: "Título del Banner"
        name: "titulo"
        widget: "string"
        required: false

      - label: "Texto del Banner"
        name: "subtitulo"
        widget: "text"
        required: false

      - label: "Imagen del Banner"
        name: "imagen"
        widget: "image"

      - label: "Mostrar Banner"
        name: "activo"
        widget: "boolean"
        default: true

      - label: "Orden"
        name: "orden"
        widget: "number"
        value_type: "int"
        min: 1
        default: 1


  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "contenido/productos"
    create: true
    slug: "{{slug}}"
    summary: "{{nombre}}"

    fields:

      - label: "Nombre del Producto"
        name: "nombre"
        widget: "string"

      - label: "Imagen del Producto"
        name: "img"
        widget: "image"

      - label: "Precio (Gs.)"
        name: "precio"
        widget: "string"

      - label: "Descripción"
        name: "desc"
        widget: "text"
        required: false
